# Messagerie souveraine — déploiement en une commande : docker compose up -d
# Variables optionnelles (voir .env.example) : SERVER_NAME, PUBLIC_HOST, PUBLIC_URL, HTTPS_PORT, AUTH_MODE
name: messagerie-souveraine

services:
  # Génère les secrets (une seule fois), la configuration de Synapse et le realm Keycloak.
  init:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    command: ["sh", "/init/init.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      AUTH_MODE: ${AUTH_MODE:-oidc}
    volumes:
      - ./config/init:/init:ro
      - ./demo:/demo:ro
      - generated:/generated
      - synapse_data:/data
      - kc_import:/kc_import
      - kc_data:/kc_data
    restart: "no"

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /generated/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - generated:/generated:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      SYNAPSE_CONFIG_PATH: /generated/homeserver.yaml
    volumes:
      - synapse_data:/data
      - generated:/generated:ro
    ports:
      # API d'administration : accessible uniquement depuis la machine hôte.
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Identité et second facteur (TOTP). Exposé aux navigateurs via Caddy sous /auth.
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Mot de passe de DÉMONSTRATION : à changer (variable KEYCLOAK_ADMIN_PASSWORD) hors démo.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin-KC-Demo-2026!}
      KC_HOSTNAME: ${PUBLIC_URL:-https://localhost}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - kc_import:/opt/keycloak/data/import:ro
      - kc_data:/opt/keycloak/data/h2
    ports:
      # API d'administration de Keycloak : accessible uniquement depuis la machine hôte (scripts/admin.py).
      - "127.0.0.1:8081:8080"

  # Crée les comptes Matrix de démonstration FICTIFS (idempotent).
  bootstrap:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    restart: "no"
    depends_on:
      synapse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - generated:/generated:ro
      - ./demo:/demo:ro
      - ./config/bootstrap:/bootstrap:ro

  element:
    image: ${ELEMENT_IMAGE:-vectorim/element-web:latest}
    restart: unless-stopped
    volumes:
      - ./config/element/config.json:/app/config.json:ro

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      element:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  generated:
  pgdata:
  synapse_data:
  kc_import:
  kc_data:
  caddy_data:
  caddy_config:
