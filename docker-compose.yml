# Messagerie souveraine — déploiement en une commande : docker compose up -d
# Variables optionnelles (voir .env.example) : SERVER_NAME, PUBLIC_HOST, PUBLIC_URL, HTTPS_PORT
name: messagerie-souveraine

services:
  # Génère les secrets (une seule fois) et la configuration de Synapse.
  init:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    command: ["sh", "/init/init.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
    volumes:
      - ./config/init:/init:ro
      - generated:/generated
      - synapse_data:/data
    restart: "no"

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /generated/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - generated:/generated:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      SYNAPSE_CONFIG_PATH: /generated/homeserver.yaml
    volumes:
      - synapse_data:/data
      - generated:/generated:ro
    ports:
      # API d'administration : accessible uniquement depuis la machine hôte.
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Crée les comptes de démonstration FICTIFS (idempotent).
  bootstrap:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    restart: "no"
    depends_on:
      synapse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - generated:/generated:ro
      - ./demo:/demo:ro
      - ./config/bootstrap:/bootstrap:ro

  element:
    image: ${ELEMENT_IMAGE:-vectorim/element-web:latest}
    restart: unless-stopped
    volumes:
      - ./config/element/config.json:/app/config.json:ro

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      element:
        condition: service_started
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  generated:
  pgdata:
  synapse_data:
  caddy_data:
  caddy_config:
